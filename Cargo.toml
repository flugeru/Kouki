[package]
name = "kouki"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "MPV, AniList, MyAnimeList e Discord em uma interface desktop Rust"

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
rand = "0.9"
regex = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "signal"] }
url = "2"
webbrowser = "1"

[profile.release]
lto = "thin"
strip = true
