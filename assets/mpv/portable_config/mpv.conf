# ============================================================
#  Kouki — perfil de vídeo (high quality)
#
#  NOTA: esta configuração foi corrigida a partir do arquivo
#  original do usuário. O original escrevia várias opções na
#  mesma linha e usava cabeçalhos sem "#", o que o mpv rejeita
#  (o mpv aceita apenas UMA opção por linha). Todos os valores
#  originais foram preservados — apenas a sintaxe foi corrigida.
# ============================================================

[high-quality]
profile-desc=High quality VO settings

# --- Video output ---
video-output-levels=full
scale=ewa_lanczossharp
cscale=ewa_lanczossoft
dscale=ewa_lanczossharp
scale-radius=2
scale-antiring=1
cscale-antiring=1
scaler-resizes-only=yes
sigmoid-upscaling=yes
correct-downscaling=yes

# --- Temporal processing ---
interpolation=yes
video-sync=display-resample
tscale=oversample
tscale-window=quadric
tscale-radius=1.1
tscale-clamp=0.0
interpolation-preserve=yes

# --- Deband and dithering ---
deband=yes
deband-iterations=4
deband-threshold=48
deband-range=16
deband-grain=48
temporal-dither=yes
dither-depth=auto

# --- GPU and rendering ---
gpu-api=vulkan
gpu-context=auto
hwdec=auto
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1

# --- Display and subtitles ---
opengl-swapinterval=1
blend-subtitles=yes
target-colorspace-hint=yes
hdr-compute-peak=yes
window-corners=round

[default]
profile=high-quality

# --- Audio and playback ---
slang=pt-BR,pt,por,portuguese
alang=ja,jp,jpn,japanese
save-position-on-quit=yes
keep-open=yes
volume=70

# ============================================================
#  Kouki - canal IPC
#  O Kouki lê este canal para exibir o que está tocando.
# ============================================================
input-ipc-server=\\.\pipe\mpv-pipe
